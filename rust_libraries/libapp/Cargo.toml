[package]
name="libapp"
version="0.1.0"
edition="2021"



[build-dependencies]
cc="1.0"

# make sure you enable features for your target platform

[features]
target_os_linux=["x11","libc","winit/x11","winit/wayland"]
target_os_windows=[]
target_os_android=["winit/android-native-activity"]
target_os_ios=[]
target_os_macos=[]
default=["target_os_linux"]

[target.'cfg(target_os="windows")'.dependencies]
windows = {version="0.61.1",features=["Win32_Foundation","Win32_System_LibraryLoader","Win32_Graphics_OpenGL","Win32_Graphics_Gdi"]}
[target.'cfg(any(target_os="linux",target_os="unix"))'.dependencies]
x11={version="2.21.0",optional=true}
libc = {version="0.2.172",optional=true}

[dependencies]
#linux specific dependencies
libapp_proc_macros={path="../libapp_proc_macros"}
vulkano = "0.35.1"
thiserror = "2.0.12"
winit = "0.30.11"
cfg-if = "1.0.1"
glow = "0.16.0"
paste = "1.0.15"
